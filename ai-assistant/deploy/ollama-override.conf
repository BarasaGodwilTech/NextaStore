# Installed by setup-vps.sh to /etc/systemd/system/ollama.service.d/override.conf
[Service]
# Only this machine can talk to Ollama.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Keep models in RAM so no answer waits for a reload.
Environment="OLLAMA_KEEP_ALIVE=-1"
# Two answers written at the same time (keep equal to MAX_CONCURRENT in the assistant's .env). The 1.5B model's
# working memory per answer is small, so a second slot costs little RAM; if the machine struggles set both to 1.
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_MAX_LOADED_MODELS=1"

Environment="OLLAMA_FLASH_ATTENTION=1"
