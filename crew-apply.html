<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!--NEXTA_HOSTS-->
    <script src="/js/clean-url.js"></script>
    <script src="/js/growth-config.js"></script>
    <script src="/js/growth-hosts.js"></script>
    <script>
    /* Signed-out visitors read about the program first. The Join button on that page comes back here with ?go=1,
       which skips this check and carries on to sign-in. Signed-in people, and anyone returning from the sign-in hand-over, are not affected. */
    (function () { try {
        if (window.NextaHosts && window.NextaHosts.mode === 'subdomain') return;   // on circle./crew. hosts the sign-in bridge makes this call
        var t = localStorage.getItem('nextastore_token') || sessionStorage.getItem('nextastore_token');   // a session without "keep me signed in" lives in sessionStorage
        if (/[?&]go=1/.test(location.search) || location.hash.indexOf('#nxs=') === 0 || (t && t.split('.').length === 3)) return;
        window.__nxAbout = true;
        location.replace(window.NextaHosts ? window.NextaHosts.about('crew') : '/about-crew');
    } catch (e) { /* storage blocked: fall through to the normal sign-in flow */ } })();
    </script>
    <script src="/js/growth-session.js" data-auth="required"></script>
    <title>Apply to join the Crew · NextaStore</title>
    <meta name="description" content="Apply to join NextaStore Crew, the field team.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B3B2B">
    <link rel="icon" href="/assets/growth-brand/favicon/crew/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/growth-brand/favicon/crew/favicon.ico" sizes="48x48">
    <link rel="icon" href="/assets/growth-brand/favicon/crew/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/growth-brand/favicon/crew/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/growth.css">
    <link rel="stylesheet" href="/css/crew-apply.css">
</head>
<body class="gp-body ca-body" data-auth-required data-program="crew" data-page="crew-apply" data-assistant="off">
    <a class="gp-skip" href="#caMain">Skip to the form</a>
    <header class="ca-top" id="caTop">
        <div class="ca-top-in">
            <a class="ca-close" id="caClose" href="/crew" data-local aria-label="Close the application"><i class="fas fa-xmark" aria-hidden="true"></i></a>
            <div class="ca-top-text"><b>Apply to join the Crew</b><span id="caStepLabel" aria-live="polite">Loading…</span></div>
        </div>
        <ol class="ca-segs" id="caSegs" aria-hidden="true"></ol>
    </header>
    <main class="ca-main" id="caMain" tabindex="-1"><div class="gp-skel"></div><div class="gp-skel"></div></main>
    <div class="ca-bar" id="caBar" hidden>
        <div class="ca-bar-in">
            <button type="button" class="gp-btn is-big ca-back" id="caBack" hidden>Back</button>
            <button type="button" class="gp-btn is-primary is-big ca-next" id="caNext">Continue</button>
        </div>
    </div>
    <noscript><div class="ca-main"><section class="gp-card"><h2>JavaScript is needed</h2><p class="gp-muted">Please turn on JavaScript in your browser to apply to NextaStore Crew.</p></section></div></noscript>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/ui-overlays.js"></script>
    <script src="/js/growth-ui.js"></script>
    <script src="/js/crew-card-photo.js"></script>
    <script src="/js/crew-apply.js"></script>
</body>
</html>
