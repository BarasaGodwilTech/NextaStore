<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="plaster" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.7" numOctaves="2" seed="12" result="n"/>
      <feDiffuseLighting in="n" surfaceScale=".55" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="60"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in" result="lc"/>
      <feBlend in="SourceGraphic" in2="lc" mode="multiply"/>
    </filter>
    <filter id="canvas" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="2.2 2.2" numOctaves="1" seed="3" result="n"/>
      <feDiffuseLighting in="n" surfaceScale=".7" diffuseConstant="1.12" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in" result="lc"/>
      <feBlend in="SourceGraphic" in2="lc" mode="multiply"/>
    </filter>
    <filter id="wood" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.45" numOctaves="3" seed="9" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.6" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in" result="lc"/>
      <feBlend in="SourceGraphic" in2="lc" mode="multiply"/>
    </filter>
    <filter id="woodV" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.4 0.012" numOctaves="3" seed="19" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.6" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in" result="lc"/>
      <feBlend in="SourceGraphic" in2="lc" mode="multiply"/>
    </filter>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6DF"/><stop offset="1" stop-color="#EBD7AB"/></linearGradient>
    <linearGradient id="wallS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CDB682"/><stop offset="1" stop-color="#A68D5A"/></linearGradient>
    <linearGradient id="roofT" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2A7F63"/><stop offset="1" stop-color="#43A37F"/></linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A4A22"/><stop offset="1" stop-color="#58341A"/></linearGradient>
    <linearGradient id="signS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#52311a"/><stop offset="1" stop-color="#3b2312"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27B987"/><stop offset="1" stop-color="#0A7E57"/></linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF4"/><stop offset="1" stop-color="#F2E6C6"/></linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
    <linearGradient id="cast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a05" stop-opacity=".5"/><stop offset="1" stop-color="#2a1a05" stop-opacity="0"/></linearGradient>
    <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7656"/><stop offset="1" stop-color="#095A42"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9FBEE"/><stop offset=".5" stop-color="#8ADBBE"/><stop offset="1" stop-color="#4FB394"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".4" stop-color="#E9B13A"/><stop offset="1" stop-color="#A9690F"/></linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6733B"/><stop offset="1" stop-color="#6E451F"/></linearGradient>
    <radialGradient id="jar" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#D98A14"/></radialGradient>
    <pattern id="weave" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 .75H3M0 2.25H3" stroke="#000" stroke-opacity=".08" stroke-width=".7"/><path d="M.75 0V3M2.25 0V3" stroke="#fff" stroke-opacity=".12" stroke-width=".6"/></pattern>
    <clipPath id="winC"><rect x="58" y="152" width="50" height="46" rx="3"/></clipPath>
    <clipPath id="awnC"><path d="M36 120 H184 V132 Q184 142 175 142 Q166 142 166 132 Q166 142 157 142 Q148 142 148 132 Q148 142 139 142 Q130 142 130 132 Q130 142 121 142 Q112 142 112 132 Q112 142 103 142 Q94 142 94 132 Q94 142 85 142 Q76 142 76 132 Q76 142 67 142 Q58 142 58 132 Q58 142 49 142 Q40 142 40 132 Z"/></clipPath>
  </defs>
  <ellipse cx="124" cy="216" rx="96" ry="10" fill="#000" opacity=".36" filter="url(#soft)"/>
  <ellipse cx="112" cy="208" rx="78" ry="3.6" fill="#000" opacity=".4" filter="url(#soft2)"/>

  <!-- side wall + parapet side -->
  <g filter="url(#plaster)"><path d="M178 100 L208 86 V194 L178 208Z" fill="url(#wallS)"/></g>
  <g filter="url(#wood)"><path d="M180 72 L210 60 V86 L180 100Z" fill="url(#signS)"/></g>
  <!-- roof deck -->
  <g filter="url(#plaster)"><path d="M40 72 L70 60 H210 L180 72Z" fill="url(#roofT)"/></g>
  <path d="M40 72 L70 60 H210" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
  <!-- front wall -->
  <g filter="url(#plaster)"><path d="M42 98 H178 V208 H42Z" fill="url(#wall)"/></g>
  <!-- sign board -->
  <rect x="40" y="72" width="140" height="28" fill="#000" opacity=".3" transform="translate(0 3)" filter="url(#soft2)"/>
  <g filter="url(#wood)"><rect x="40" y="72" width="140" height="28" fill="url(#sign)"/></g>
  <rect x="40" y="72" width="140" height="28" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1"/>
  <rect x="44" y="76" width="132" height="20" rx="1.5" fill="none" stroke="#E9B13A" stroke-opacity=".7" stroke-width="1.2"/>
  <g font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" text-anchor="middle">
    <text x="111" y="92.6" font-size="16.5" letter-spacing="5" fill="#000" opacity=".4">SHOP</text>
    <text x="110" y="91.6" font-size="16.5" letter-spacing="5" fill="url(#brass)">SHOP</text>
  </g>
  <!-- shadow cast by the awning onto the wall -->
  <rect x="42" y="136" width="136" height="26" fill="url(#cast)"/>

  <!-- window -->
  <rect x="53" y="148" width="60" height="54" rx="4" fill="#000" opacity=".28" transform="translate(2 3)" filter="url(#soft2)"/>
  <g filter="url(#wood)"><rect x="53" y="148" width="60" height="54" rx="4" fill="url(#doorG)"/></g>
  <rect x="58" y="152" width="50" height="46" rx="2.4" fill="url(#glass)"/>
  <g clip-path="url(#winC)">
    <!-- shelves with goods -->
    <rect x="58" y="152" width="50" height="46" fill="#0b3b2b" opacity=".34"/>
    <rect x="58" y="172" width="50" height="3.4" fill="url(#shelf)"/>
    <rect x="58" y="193" width="50" height="5" fill="url(#shelf)"/>
    <!-- top shelf: jars + folded cloth -->
    <rect x="63" y="158" width="9" height="14" rx="2.2" fill="url(#jar)"/><rect x="64" y="155.4" width="7" height="3.6" rx="1" fill="#6b4217"/>
    <rect x="75" y="161" width="9" height="11" rx="2.2" fill="url(#jar)"/><rect x="76" y="158.6" width="7" height="3" rx="1" fill="#6b4217"/>
    <rect x="88" y="164" width="16" height="8" rx="1.6" fill="#E8574A"/><rect x="88" y="164" width="16" height="2.6" fill="#fff" opacity=".35"/><rect x="89" y="159" width="14" height="5" rx="1.4" fill="#F3B63C"/>
    <!-- bottom shelf: baskets -->
    <path d="M64 192 L66 180 H82 L84 192Z" fill="#D2A25E"/><path d="M64 192 L66 180 H82 L84 192Z" fill="url(#weave)"/><ellipse cx="74" cy="180" rx="8" ry="2" fill="#8E5E2A"/>
    <path d="M90 192 L92 183 H104 L106 192Z" fill="#B9884A"/><path d="M90 192 L92 183 H104 L106 192Z" fill="url(#weave)"/><ellipse cx="98" cy="183" rx="6" ry="1.6" fill="#6f4a22"/>
    <!-- glass sheen -->
    <path d="M58 152 L80 152 L58 186Z" fill="#fff" opacity=".42"/>
    <path d="M86 152 L92 152 L66 198 H60Z" fill="#fff" opacity=".22"/>
  </g>
  <rect x="58" y="152" width="50" height="46" rx="2.4" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="1"/>
  <rect x="49" y="200" width="68" height="5" rx="1.6" fill="#B58A52"/><rect x="49" y="200" width="68" height="1.6" fill="#fff" opacity=".5"/>

  <!-- door -->
  <rect x="124" y="140" width="40" height="68" rx="3" fill="#000" opacity=".3" transform="translate(2 3)" filter="url(#soft2)"/>
  <g filter="url(#woodV)"><rect x="124" y="140" width="40" height="68" rx="3" fill="url(#doorG)"/></g>
  <rect x="124" y="140" width="40" height="68" rx="3" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
  <g filter="url(#woodV)"><rect x="130" y="147" width="28" height="22" rx="2" fill="url(#doorG)"/></g>
  <rect x="130" y="147" width="28" height="22" rx="2" fill="#7BE0BC" opacity=".5"/>
  <rect x="130" y="147" width="28" height="22" rx="2" fill="none" stroke="#04382a" stroke-opacity=".6" stroke-width="1.2"/>
  <path d="M130 147 L146 147 L130 164Z" fill="#fff" opacity=".35"/>
  <rect x="130" y="175" width="28" height="26" rx="2" fill="none" stroke="#04382a" stroke-opacity=".5" stroke-width="1.2"/>
  <rect x="130.8" y="175.8" width="26.4" height="24.4" rx="1.6" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>
  <circle cx="157" cy="176" r="3" fill="#000" opacity=".3" transform="translate(.8 1.2)"/><circle cx="157" cy="176" r="3" fill="url(#brass)"/><circle cx="156.2" cy="175.2" r="1" fill="#fff" opacity=".9"/>
  <rect x="118" y="206" width="52" height="4.5" rx="1.6" fill="#3a2a17"/><rect x="118" y="206" width="52" height="1.4" fill="#fff" opacity=".25"/>
  <!-- OPEN sign -->
  <g transform="rotate(-4 144 126)">
    <path d="M141 134 V148" stroke="#8a6b34" stroke-width="1" opacity=".8"/>
    <rect x="132" y="150" width="24" height="9" rx="1.8" fill="#000" opacity=".3" transform="translate(1 1.6)"/>
    <rect x="132" y="150" width="24" height="9" rx="1.8" fill="#FFF8E4"/>
    <text x="144" y="157.4" font-size="6.2" font-weight="800" letter-spacing="1.1" text-anchor="middle" fill="#0B7A55" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif">OPEN</text>
  </g>

  <!-- awning: sloped canopy then scalloped valance -->
  <defs><clipPath id="valC"><path d="M34 122 H186 V132 Q186 144 176.5 144 Q167 144 167 132 Q167 144 157.5 144 Q148 144 148 132 Q148 144 138.5 144 Q129 144 129 132 Q129 144 119.5 144 Q110 144 110 132 Q110 144 100.5 144 Q91 144 91 132 Q91 144 81.5 144 Q72 144 72 132 Q72 144 62.5 144 Q53 144 53 132 Q53 144 43.5 144 Q34 144 34 132 Z"/></clipPath><clipPath id="canC"><path d="M46 100 H174 L186 122 H34Z"/></clipPath></defs>
  <g filter="url(#canvas)"><path d="M46 100 H174 L186 122 H34Z" fill="url(#cr)"/></g>
  <g clip-path="url(#canC)"><path d="M46 100 H62 L53 122 H34Z" fill="url(#gr)"/><path d="M78 100 H94 L91 122 H72Z" fill="url(#gr)"/><path d="M110 100 H126 L129 122 H110Z" fill="url(#gr)"/><path d="M142 100 H158 L167 122 H148Z" fill="url(#gr)"/><rect x="30" y="100" width="160" height="22" fill="url(#weave)"/></g>
  <path d="M46 100 H174 L186 122 H34Z" fill="url(#canopy)"/>
  <path d="M46 100 H174" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
  <!-- valance -->
  <path d="M34 122 H186 V132 Q186 144 176.5 144 Q167 144 167 132 Q167 144 157.5 144 Q148 144 148 132 Q148 144 138.5 144 Q129 144 129 132 Q129 144 119.5 144 Q110 144 110 132 Q110 144 100.5 144 Q91 144 91 132 Q91 144 81.5 144 Q72 144 72 132 Q72 144 62.5 144 Q53 144 53 132 Q53 144 43.5 144 Q34 144 34 132 Z" fill="#000" opacity=".28" transform="translate(0 3)" filter="url(#soft2)"/>
  <g filter="url(#canvas)"><path d="M34 122 H186 V132 Q186 144 176.5 144 Q167 144 167 132 Q167 144 157.5 144 Q148 144 148 132 Q148 144 138.5 144 Q129 144 129 132 Q129 144 119.5 144 Q110 144 110 132 Q110 144 100.5 144 Q91 144 91 132 Q91 144 81.5 144 Q72 144 72 132 Q72 144 62.5 144 Q53 144 53 132 Q53 144 43.5 144 Q34 144 34 132 Z" fill="url(#cr)"/></g>
  <g clip-path="url(#valC)"><path d="M34 122 H53 V132 Q53 144 43.5 144 Q34 144 34 132 Z" fill="url(#gr)"/><path d="M72 122 H91 V132 Q91 144 81.5 144 Q72 144 72 132 Z" fill="url(#gr)"/><path d="M110 122 H129 V132 Q129 144 119.5 144 Q110 144 110 132 Z" fill="url(#gr)"/><path d="M148 122 H167 V132 Q167 144 157.5 144 Q148 144 148 132 Z" fill="url(#gr)"/><rect x="30" y="122" width="160" height="24" fill="url(#weave)"/>
    <rect x="30" y="122" width="160" height="5" fill="#000" opacity=".12"/>
    <path d="M30 138 Q110 150 190 138 V148 H30Z" fill="#000" opacity=".08"/></g>
  <path d="M34 122 H186" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>
  <path d="M36 128.5 H184" stroke="#fff" stroke-opacity=".32" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
