<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline · NextaStore</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B3B2B">
    <link rel="icon" href="assets/brand/png/favicon/favicon.ico" sizes="any">
    <link rel="manifest" href="/manifest.json">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0B3B2B;
            color: #fff;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .offline-card { max-width: 380px; }
        .offline-card img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0 0 10px; }
        p { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.8); margin: 0 0 24px; }
        button {
            background: #01B075;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #008558; }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="assets/brand/png/icon/icon-192.png" alt="NextaStore">
        <h1>You're offline</h1>
        <p>We couldn't reach NextaStore. Check your connection and try again — anything you already loaded is still available.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        // Forces an already-open tab/installed PWA window onto a newly
        // activated service worker instead of leaving stale JS/CSS running
        // until the person manually closes and reopens the app. Guarded so
        // it only fires for a real version change: `nsHadController` records
        // whether THIS load was already under a service worker's control
        // before registering — a brand-new visitor's very first
        // controllerchange (clients.claim() taking control for the first
        // time) has nothing stale to replace, so that one is skipped;
        // `nsRefreshed` stops a second stray event from reloading twice.
        var nsHadController = !!navigator.serviceWorker.controller;
        var nsRefreshed = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!nsHadController) { nsHadController = true; return; }
          if (nsRefreshed) return;
          nsRefreshed = true;
          window.location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js").catch(function () {});
        });
      }
    </script>
</body>
</html>
