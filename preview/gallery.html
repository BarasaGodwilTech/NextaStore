<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextaStore template gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<style>
:root{--bg:#F7FAF8;--ink:#0B3B2B;--mut:#52615B;--card:#fff;--line:#DCE6E1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1C15;--ink:#EAF4EF;--mut:#9DB5AA;--card:#12281F;--line:#23423A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
header{padding:20px 16px 8px}h1{font-size:20px;margin:0 0 4px}p.s{margin:0;color:var(--mut);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
section{padding:18px 16px}h2{font-size:17px;margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;margin-top:12px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
figure canvas{width:100%;height:auto;display:block;border-radius:10px;background:#ddd}
figcaption{font-size:12px;margin-top:8px;color:var(--mut)}figcaption b{color:var(--ink)}
.new{background:#FFB038;color:#0B3B2B;border-radius:99px;padding:1px 8px;font-size:10px;font-weight:700;margin-left:6px}
.err{color:#b3261e;font-size:12px}
</style></head><body>
<header><h1>NextaStore template gallery</h1><p class="s" id="meta">Drawn live by the studio's own code with sample store data. <span class="new">NEW</span> = added this round.</p></header>
<nav><a href="#posts">Product posts</a><a href="#posters">Posters &amp; signs</a></nav>
<section id="posts"><h2>Product posts</h2><p class="s">Portrait 1080×1350, deep and light moods.</p><div class="grid" id="gPosts"></div></section>
<section id="posters"><h2>Posters &amp; signs</h2><p class="s">Same swatches as the studio.</p><div class="grid" id="gPosters"></div></section>
<script>
/**
 * NextaQR: a small, dependency-free QR code generator (byte mode, error correction M, versions 1 to 10,
 * so up to 213 bytes: plenty for an invite link). It exists so a Crew member's QR code works with NO
 * internet and no CDN, which matters in a market with weak data.
 *
 *   NextaQR.encode('https://...')               -> { size, modules: boolean[][] }
 *   NextaQR.svg('https://...', { scale: 6 })    -> '<svg ...>' string
 *   NextaQR.draw(canvas, 'https://...', { scale: 6, margin: 4 })
 *   NextaQR.render(containerEl, 'https://...')  -> appends a canvas
 *
 * The algorithm follows the public QR Code Model 2 spec (the structure is the well-known one used by
 * Project Nayuki's MIT-licensed reference generator). scripts/growth-qr-test.py decodes its output
 * with OpenCV to prove it scans.
 */
(function (root) {
    'use strict';

    const ECC_PER_BLOCK_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
    const NUM_BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
    const MAX_VERSION = 10;
    const FORMAT_BITS_M = 0; // error correction level M

    const getBit = (x, i) => ((x >>> i) & 1) !== 0;

    function rawDataModules(ver) {
        let result = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
            const numAlign = Math.floor(ver / 7) + 2;
            result -= (25 * numAlign - 10) * numAlign - 55;
            if (ver >= 7) result -= 36;
        }
        return result;
    }
    const dataCodewords = (ver) => Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK_M[ver] * NUM_BLOCKS_M[ver];

    // ---- Reed-Solomon over GF(2^8), polynomial 0x11D
    function gfMul(x, y) {
        let z = 0;
        for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
        return z;
    }
    function rsDivisor(degree) {
        const result = new Array(degree).fill(0);
        result[degree - 1] = 1;
        let r = 1;
        for (let i = 0; i < degree; i++) {
            for (let j = 0; j < result.length; j++) { result[j] = gfMul(result[j], r); if (j + 1 < result.length) result[j] ^= result[j + 1]; }
            r = gfMul(r, 0x02);

        return result;
    }
    function rsRemainder(data, divisor) {
        const result = divisor.map(() => 0);
        for (const b of data) {
            const factor = b ^ result.shift();
            result.push(0);
            divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });

    function utf8Bytes(text) {
        if (typeof TextEncoder !== 'undefined') return Array.from(new TextEncoder().encode(text));

    }

    function buildCodewords(bytes, ver) {
        const bits = [];
        const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
        put(0x4, 4);                              // byte mode
        put(bytes.length, ver >= 10 ? 16 : 8);    // character count
        bytes.forEach((b) => put(b, 8));

        put(0, Math.min(4, capacityBits - bits.length)); // terminator

    }

    function addEccAndInterleave(data, ver) {
        const numBlocks = NUM_BLOCKS_M[ver], eccLen = ECC_PER_BLOCK_M[ver];
        const rawCodewords = Math.floor(rawDataModules(ver) / 8);
        const numShort = numBlocks - (rawCodewords % numBlocks);
        const shortLen = Math.floor(rawCodewords / numBlocks);
        const blocks = []; const div = rsDivisor(eccLen);
        for (let i = 0, k = 0; i < numBlocks; i++) {
            const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1)); k += dat.length;
            const ecc = rsRemainder(dat, div);
            if (i < numShort) dat.push(0);
            blocks.push(dat.concat(ecc));

        for (let i = 0; i < blocks[0].length; i++) blocks.forEach((block, j) => { if (i !== shortLen - eccLen || j >= numShort) result.push(block[i]); });

    }

    function alignmentPositions(ver) {
        if (ver === 1) return [];

        for (; ver <= MAX_VERSION; ver++) {
            const used = 4 + (ver >= 10 ? 16 : 8) + bytes.length * 8;
            if (used <= dataCodewords(ver) * 8) break;
        }

        const isFn = Array.from({ length: size }, () => new Array(size).fill(false));
        const setFn = (x, y, dark) => { modules[y][x] = dark; isFn[y][x] = true; };

        // function patterns
        for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
        const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)); const x = cx + dx, y = cy + dy; if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4); } };
        finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
        const al = alignmentPositions(ver);
        for (let i = 0; i < al.length; i++) for (let j = 0; j < al.length; j++) {
            if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) continue;
            for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }

            const data = (FORMAT_BITS_M << 3) | mask; let rem = data;
            for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);

            for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));
            for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));

            let rem = ver;

        }

        let bitIndex = 0;
        for (let right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
                const x = right - j; const upward = ((right + 1) & 2) === 0; const y = upward ? size - 1 - vert : vert;
                if (!isFn[y][x] && bitIndex < codewords.length * 8) { modules[y][x] = getBit(codewords[bitIndex >>> 3], 7 - (bitIndex & 7)); bitIndex++; }
            }
        }

        // masking: try all 8 and keep the best
        const applyMask = (mask) => {
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                let invert;
                switch (mask) {
                    case 0: invert = (x + y) % 2 === 0; break;
                    case 1: invert = y % 2 === 0; break;
                    case 2: invert = x % 3 === 0; break;
                    case 3: invert = (x + y) % 3 === 0; break;
                    case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
                    case 5: invert = ((x * y) % 2) + ((x * y) % 3) === 0; break;
                    case 6: invert = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0; break;
                    default: invert = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
                }
                if (!isFn[y][x] && invert) modules[y][x] = !modules[y][x];
            }
        };
        const penalty = () => {
            let result = 0;
            const addHistory = (run, hist) => { if (hist[0] === 0) run += size; hist.pop(); hist.unshift(run); };
            const countPatterns = (h) => { const n = h[1]; const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n; return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0); };
            const terminate = (color, run, hist) => { if (color) { addHistory(run, hist); run = 0; } run += size; addHistory(run, hist); return countPatterns(hist); };
            for (let pass = 0; pass < 2; pass++) {
                for (let a = 0; a < size; a++) {
                    let color = false, run = 0; const hist = [0, 0, 0, 0, 0, 0, 0];
                    for (let b = 0; b < size; b++) {
                        const m = pass === 0 ? modules[a][b] : modules[b][a];
                        if (m === color) { run++; if (run === 5) result += 3; else if (run > 5) result++; }
                        else { addHistory(run, hist); if (!color) result += countPatterns(hist) * 40; color = m; run = 1; }
                    }
                    result += terminate(color, run, hist) * 40;
                }
            }
            for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const c = modules[y][x]; if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) result += 3; }
            let dark = 0; modules.forEach((row) => row.forEach((m) => { if (m) dark++; }));
            const total = size * size; result += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
            return result;
        };

        for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const s = penalty(); if (s < bestScore) { bestScore = s; best = m; } applyMask(m); }
        applyMask(best); drawFormat(best);
        return { size, modules, version: ver, mask: best };
    }

    function svg(text, opts = {}) {
        const { scale = 6, margin = 4, dark = '#0b3b2b', light = '#ffffff' } = opts;
        const q = encode(text); const dim = (q.size + margin * 2) * scale;
        let path = '';
        for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) path += `M${(x + margin) * scale},${(y + margin) * scale}h${scale}v${scale}h-${scale}z`;
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" width="${dim}" height="${dim}" role="img" aria-label="QR code"><rect width="${dim}" height="${dim}" fill="${light}"/><path d="${path}" fill="${dark}"/></svg>`;
    }

    function draw(canvas, text, opts = {}) {
        const { scale = 6, margin = 4, dark = '#0b3b2b', light = '#ffffff' } = opts;
        const q = encode(text); const dim = (q.size + margin * 2) * scale;
        canvas.width = dim; canvas.height = dim;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = light; ctx.fillRect(0, 0, dim, dim); ctx.fillStyle = dark;
        for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) ctx.fillRect((x + margin) * scale, (y + margin) * scale, scale, scale);
        return canvas;
    }

    function render(container, text, opts = {}) {
        const canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-label', 'QR code with your invite link');
        canvas.style.maxWidth = '100%'; canvas.style.height = 'auto';

    }

    const api = { encode, svg, draw, render };
    if (typeof module !== 'undefined' && module.exports) module.exports = api;
    root.NextaQR = api;

/**
 * NextaBrandKit: draws a seller's printable and shareable marketing pieces (poster, counter sign, WhatsApp status,
 * square post, business cards) on a <canvas>, with the store's own QR code on every one. Works offline: the QR
 * comes from js/growth-qr.js (NextaQR) and nothing is fetched except the seller's own logo.
 *
 *   NextaBrandKit.TEMPLATES                       -> [{ id, label, w, h, ... }]
 *   await NextaBrandKit.render(canvas, id, data)  -> draws the template into `canvas` (sets its pixel size)
 *   NextaBrandKit.qrCanvas(url, px, { fg, bg })   -> a plain QR canvas (for the "Download QR" button)
 *   NextaBrandKit.qrSvg(url, { fg, bg })          -> SVG string
 *   NextaBrandKit.pdfFromCanvases([canvas...], { widthMm, heightMm }) -> Blob (application/pdf), one page each
 *   NextaBrandKit.cardSheet(data)                 -> canvas: A4 sheet with 10 business cards + cut marks
 *   NextaBrandKit.canvasToBlob(canvas, type, q)   -> Promise<Blob>
 *
 * data = { name, tagline, phone, url, logo, cta, owner, title, email, theme: { bg, fg, accent }, showPhone, showLogo }
 * Layouts are drawn on a fixed design grid and scaled, so every size stays proportional.
 */
(function (root) {
    'use strict';

    const FONT = "Poppins, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";

    const TEMPLATES = [
        { id: 'poster',  group: 'poster', label: 'Poster (A4)',        w: 2480, h: 3508, mm: [210, 297], pdf: true,  file: 'poster-a4' },
        { id: 'sign',    group: 'poster', label: 'Counter sign (A5)',  w: 1748, h: 2480, mm: [148, 210], pdf: true,  file: 'counter-sign-a5' },
        { id: 'story',   group: 'social', label: 'WhatsApp status',    w: 1080, h: 1920, file: 'whatsapp-status' },
        { id: 'square',  group: 'social', label: 'Square post',        w: 1080, h: 1080, file: 'square-post' },
        { id: 'card',    group: 'card',   label: 'Business card',      w: 1050, h: 600,  mm: [88.9, 50.8], file: 'business-card' }
    ];

    // ---- colour helpers -------------------------------------------------------------------------------------
    function hex(c) { return /^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : null; }
    function rgb(c) { const h = hex(c) || '#0B3B2B'; return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }

        const t = data.theme || {};
        const bg = hex(t.bg) || '#0B3B2B';
        const dark = isDark(bg);
        return {
            bg, dark,
            fg: hex(t.fg) || (dark ? '#FFFFFF' : '#0B3B2B'),
            // accent is the highlight colour: gold on dark backgrounds, deep green on light ones
            accent: hex(t.accent) || (dark ? '#FFB038' : '#008558'),
            soft: dark ? mix(bg, '#FFFFFF', 0.12) : mix(bg, '#000000', 0.06),
            muted: dark ? mix(bg, '#FFFFFF', 0.72) : mix(bg, '#000000', 0.62),

    // ---- canvas helpers -------------------------------------------------------------------------------------
    function rr(ctx, x, y, w, h, r) {

     *   2. through our own image route, /api/media/proxy, for images in our storage bucket (which is on another origin

    }
    const imageCache = new Map();
    function loadImageSafe(src) {
        if (!src) return Promise.resolve(null);
        if (imageCache.has(src)) return imageCache.get(src);
        const p = (async () => {
            if (/^(data|blob):/i.test(src)) return tryImage(src, false);
            const direct = await tryImage(src, true);
            if (direct) return direct;
            const api = (typeof app !== 'undefined' && app && app.apiBaseUrl) || '';   // `app` is a global const, not a window property
            if (!api || !/^https?:/i.test(src)) return null;
            return tryImage(`${String(api).replace(/\/+$/, '')}/media/proxy?u=${encodeURIComponent(src)}`, true);
        })();

        p.then((v) => { if (!v) imageCache.delete(src); });     // a failure is retried next time, not remembered
        return p;

    const lightTheme = (t) => ({ dark: false, soft: '#EAF0ED', bg: INK, accent: DEEP, fg: INK, muted: '#52615B', qrFg: INK });

    function opening(ctx, W, H_, d, t, logo) {

    function qrCard(ctx, d, t, x, y, size, u) { H.drawQR(ctx, d.url, x, y, size, t, { fg: INK, shadow: true, radius: size * 0.1 }); }
    function pill(ctx, x, y, w, h, bg, fg, text, weight, size, maxW) {
        ctx.fillStyle = bg; H.rr(ctx, x, y, w, h, h / 2); ctx.fill();
        const f = H.fit(ctx, text, weight, size, size * 0.55, maxW, 1); ctx.font = font(weight, f.size); ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.lines[0], x + w / 2, y + h / 2 + f.size * 0.04); ctx.textBaseline = 'alphabetic';
    }
    function brandRow(ctx, d, t, logo, cx, cy, r, u, color) {
        logoOn(ctx, logo, d, cx, cy, r, t);
        const f = H.fit(ctx, String(d.name || 'My Store'), 700, 34 * u, 20 * u, 700 * u, 1); ctx.font = font(700, f.size); ctx.fillStyle = color || t.fg; ctx.textAlign = 'center'; ctx.fillText(f.lines[0], cx, cy + r + 20 * u + f.size * 0.8);

    function truck(ctx, x, y, s, body, cab, glass) {
        ctx.fillStyle = body; H.rr(ctx, x, y, 300 * s, 190 * s, 22 * s); ctx.fill();
        ctx.fillStyle = cab; H.rr(ctx, x + 310 * s, y + 60 * s, 170 * s, 130 * s, 26 * s); ctx.fill();

        ctx.fillStyle = cab; ctx.fillRect(x + 20 * s, y + 175 * s, 460 * s, 16 * s);
        [[90, 210], [390, 210]].forEach(([wx, wy]) => { ctx.fillStyle = '#15171A'; ctx.beginPath(); ctx.arc(x + wx * s, y + wy * s, 38 * s, 0, 7); ctx.fill(); ctx.fillStyle = '#C9D1CD'; ctx.beginPath(); ctx.arc(x + wx * s, y + wy * s, 16 * s, 0, 7); ctx.fill(); });

    const LAYOUTS = { opening, sale, scansign, delivery, openhours, thanks, flash, newin };
    const base = K.render;
    K.render = async function (canvas, id, data, opts) {
        if (!LAYOUTS[id]) return base.apply(this, arguments);
        if (typeof root.NextaQR === 'undefined') throw new Error('QR generator missing');
        if (!data || !data.url) throw new Error('No store link to put in the QR code');
        opts = opts || {};
        const T = K.TEMPLATES.find((x) => x.id === id);
        try { if (root.document && root.document.fonts && root.document.fonts.load) await Promise.all([root.document.fonts.load(font(400, 40)), root.document.fonts.load(font(700, 40))]); } catch (e) { /* system font */ }
        const logo = data.showLogo === false ? null : await H.loadLogo(data.logo);
        const scale = opts.scale || 1;
        canvas.width = Math.round(T.w * scale); canvas.height = Math.round(T.h * scale);
        const ctx = canvas.getContext('2d'), t = K.themeFrom(data);

(async function(){
  const store={name:'Nakato Gadgets',url:'https://nextastores.com/nakato-gadgets',color:'#00B074',phone:'0772 123 456',logo:null,banner:null};
  function phoneImg(body,screen){const c=document.createElement('canvas');c.width=460;c.height=900;const x=c.getContext('2d');
    x.fillStyle=body;x.beginPath();x.roundRect(10,10,440,880,80);x.fill();x.fillStyle=screen;x.beginPath();x.roundRect(30,34,400,832,62);x.fill();
    x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.roundRect(30,34,400,360,62);x.fill();x.fillStyle=body;x.beginPath();x.arc(230,76,18,0,7);x.fill();return c;}
  function photoImg(a,b){const c=document.createElement('canvas');c.width=1000;c.height=1000;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1000,1000);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,1000,1000);
    x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.roundRect(330,170,340,660,60);x.fill();return c;}
  const P1={name:'Samsung Galaxy A06 - 6.7" 4GB RAM 128GB - Black',price:689000,originalPrice:985000,image:phoneImg('#15171A','#2EDDA2'),mode:'cutout'};
  const P2={name:'Itel P55',price:520000,originalPrice:0,image:phoneImg('#3B2A12','#FFB038'),mode:'cutout'};
  const P3={name:'Lenovo IdeaPad 3',price:1850000,originalPrice:0,image:photoImg('#7FD6FF','#2A6F97'),mode:'photo'};
  const P4={name:'Wireless earbuds',price:85000,originalPrice:99000,image:photoImg('#FFD59A','#E08A00'),mode:'photo'};
  const meta=document.getElementById('meta');const mk=(grid,label,isNew)=>{const f=document.createElement('figure');const c=document.createElement('canvas');const cap=document.createElement('figcaption');cap.innerHTML='<b>'+label+'</b>'+(isNew?'<span class="new">NEW</span>':'');f.append(c,cap);document.getElementById(grid).appendChild(f);return {c,cap};};
  const NEW_STYLES=['arch','drop','catalogue','bold'];
  for(const st of NextaPosts.STYLES){
    for(const mood of ['deep','light']){
      const {c,cap}=mk('gPosts',st.label+' · '+mood,NEW_STYLES.includes(st.id));
      const multi=st.products[1]>1, prods=multi?[P1,P2,P3,P4]:[P1];
      try{const rep=await NextaPosts.render(c,{style:st.id,format:'portrait',mood,badge:multi?'NEW ARRIVALS':(st.id==='deal'||st.id==='drop'?'ON SALE':'NEW IN'),cta:'Scan to order',store,showPhone:true,showBanner:false,showLogo:true,products:prods},{scale:.5});
        if(rep.shrunk.length||rep.truncated.length)cap.innerHTML+=' <span class="err">text shrunk/cut: '+rep.shrunk.length+'/'+rep.truncated.length+'</span>';
      }catch(e){cap.innerHTML+=' <span class="err">'+e.message+'</span>';}
    }
  }
  for(const fmt of ['square','story']){for(const sid of ['arch','drop']){const {c,cap}=mk('gPosts',sid+' · '+fmt,true);
    try{await NextaPosts.render(c,{style:sid,format:fmt,mood:'deep',badge:sid==='drop'?'ON SALE':'NEW IN',cta:'Scan to order',store,showPhone:true,showBanner:false,showLogo:true,products:[P1]},{scale:.4});}catch(e){cap.innerHTML+=' <span class="err">'+e.message+'</span>';}}}
  const NEWT=['opening','sale','scansign','delivery','openhours','thanks','flash','newin'];
  const swatches=[['ink','#0B3B2B'],['gold','#FFB038'],['light','#FFFFFF']];
  for(const t of NextaBrandKit.TEMPLATES.filter(t=>t.group!=='card')){
    for(const [sid,bg] of swatches){
      const {c,cap}=mk('gPosters',t.label+' · '+sid,NEWT.includes(t.id));
      try{await NextaBrandKit.render(c,t.id,{name:store.name,url:store.url,phone:store.phone,showPhone:true,showLogo:true,tagline:'',cta:'',theme:{bg}},{scale:t.w>2000?.2:.4});}
      catch(e){cap.innerHTML+=' <span class="err">'+e.message+'</span>';}
    }
  }
  meta.insertAdjacentHTML('beforeend',' Rendered '+document.querySelectorAll('canvas').length+' previews.');
})();
</script></body></html>
