    <script>
      if ("serviceWorker" in navigator) {
        // Forces an already-open tab/installed PWA window onto a newly
        // activated service worker instead of leaving stale JS/CSS running
        // until the person manually closes and reopens the app. Guarded so
        // it only fires for a real version change: `nsHadController` records
        // whether THIS load was already under a service worker's control
        // before registering — a brand-new visitor's very first
        // controllerchange (clients.claim() taking control for the first
        // time) has nothing stale to replace, so that one is skipped;
        // `nsRefreshed` stops a second stray event from reloading twice.
        var nsHadController = !!navigator.serviceWorker.controller;
        var nsRefreshed = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!nsHadController) { nsHadController = true; return; }
          if (nsRefreshed) return;
          nsRefreshed = true;
          window.location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js").catch(function () {});
        });
      }
    </script>
