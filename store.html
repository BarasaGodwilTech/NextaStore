<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B3B2B">
    <link rel="apple-touch-icon" href="/assets/brand/png/icon/icon-180.png">
    <title>Store — NextaStore</title>
    <meta name="robots" content="noindex">
    <script>
        // Redirect to the new store-detail page with preserved query parameters
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeId = urlParams.get('store');
            const redirectUrl = storeId 
                ? `store-detail.html?store=${encodeURIComponent(storeId)}` 
                : 'store-detail.html';
            window.location.href = redirectUrl;
        })();
    </script>
    <link rel="icon" href="assets/brand/png/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/png/favicon/favicon-16.png">

    <link rel="icon" type="image/png" sizes="48x48" href="assets/brand/png/favicon/favicon-48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/png/favicon/favicon-64.png">

<body>
    <div class="page-init-skeleton" data-page-skeleton aria-hidden="true">
        <div class="skeleton skeleton-text-lg"></div>

        <div class="skeleton skeleton-text-sm"></div>
    </div>
    <p>Opening the store… <a href="store-detail.html">Continue</a></p>
    <script>
      if ("serviceWorker" in navigator) {
        // Forces an already-open tab/installed PWA window onto a newly
        // activated service worker instead of leaving stale JS/CSS running
        // until the person manually closes and reopens the app. Guarded so
        // it only fires for a real version change: `nsHadController` records
        // whether THIS load was already under a service worker's control
        // before registering — a brand-new visitor's very first
        // controllerchange (clients.claim() taking control for the first
        // time) has nothing stale to replace, so that one is skipped;
        // `nsRefreshed` stops a second stray event from reloading twice.
        var nsHadController = !!navigator.serviceWorker.controller;
        var nsRefreshed = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!nsHadController) { nsHadController = true; return; }
          if (nsRefreshed) return;
          nsRefreshed = true;
          window.location.reload();
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js").catch(function () {});
        });
      }
    </script>
</body>
</html>
