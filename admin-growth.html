<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!--NEXTA_HOSTS-->
    <script src="/js/clean-url.js"></script>
    <script src="/js/growth-config.js"></script>
    <script src="/js/growth-hosts.js"></script>
    <title>Growth program · NextaStore Admin</title>
    <meta name="description" content="Admin console for NextaStore Circle and NextaStore Crew.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B3B2B">
    <link rel="icon" href="/assets/growth-brand/favicon/circle/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/growth-brand/favicon/circle/favicon.ico" sizes="48x48">
    <link rel="icon" href="/assets/growth-brand/favicon/circle/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/assets/growth-brand/favicon/circle/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/assets/growth-brand/favicon/circle/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/growth.css">
</head>
<body class="gp-body" data-auth-required data-admin-required data-program="circle" data-assistant="off">
    <a class="gp-skip" href="#agRoot">Skip to content</a>
    <header class="gp-top">
        <a class="gp-brand" href="/admin"><img src="/assets/growth-brand/svg/lockup-circle.svg" alt="NextaStore Circle and NextaStore Crew admin" height="46"></a>
        <nav aria-label="Growth sections" id="agTabs">
            <a href="#overview" data-tab="overview"><i class="fas fa-gauge" aria-hidden="true"></i><span>Overview</span></a>
            <a href="#economics" data-tab="economics"><i class="fas fa-scale-balanced" aria-hidden="true"></i><span>Economics</span></a>
            <a href="#payouts" data-tab="payouts"><i class="fas fa-money-bill-transfer" aria-hidden="true"></i><span>Payouts</span><b class="gp-count" data-count="payouts" hidden></b></a>
            <a href="#review" data-tab="review"><i class="fas fa-magnifying-glass-chart" aria-hidden="true"></i><span>Review</span><b class="gp-count" data-count="review" hidden></b></a>
            <a href="#crew" data-tab="crew"><i class="fas fa-compass" aria-hidden="true"></i><span>Applications</span><b class="gp-count" data-count="crew" hidden></b></a>
            <a href="#partners" data-tab="partners"><i class="fas fa-users" aria-hidden="true"></i><span>Partners</span></a>
            <a href="#flags" data-tab="flags"><i class="fas fa-flag" aria-hidden="true"></i><span>Flags</span><b class="gp-count" data-count="flags" hidden></b></a>
            <a href="#campaigns" data-tab="campaigns"><i class="fas fa-bullhorn" aria-hidden="true"></i><span>Campaigns</span></a>
        </nav>
        <div class="account-nav-slot" data-account-nav></div>
    </header>
    <main class="gp-shell" id="agRoot" tabindex="-1"><div class="gp-skel"></div></main>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/ui-overlays.js"></script>
    <script src="/js/growth-ui.js"></script>
    <script src="/js/admin-growth.js"></script>
</body>
</html>
